<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; rx: 10px; stroke: #334155; stroke-width: 1.5; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 26px; font-weight: 700; fill: #f8fafc; }
      .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #94a3b8; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 600; fill: #38bdf8; }
      .metric-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .metric-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 700; fill: #f1f5f9; }
      .metric-delta { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #10b981; }
      .text-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #cbd5e1; }
      .text-bold { font-weight: 600; fill: #f8fafc; }
      .text-dim { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .tag-base { fill: #dc2626; rx: 4px; }
      .tag-lora { fill: #059669; rx: 4px; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
      .chart-grid { stroke: #334155; stroke-dasharray: 4,4; stroke-width: 1; }
      .chart-line { fill: none; stroke: #38bdf8; stroke-width: 3; }
      .chart-point { fill: #38bdf8; stroke: #0f172a; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="650" class="bg" />

  <!-- Top App Bar -->
  <rect x="30" y="25" width="1040" height="70" class="card" />
  <text x="55" y="60" class="header-title">🏛️ Public FAQ Answer Bot Trainer | LoRA Studio</text>
  <text x="55" y="80" class="header-sub">Parameter-Efficient Fine-Tuning for Municipal Policy Grounding (GPT-2 + LoRA r=8, α=16)</text>

  <!-- Metric Card 1 -->
  <rect x="30" y="110" width="245" height="95" class="card" />
  <text x="50" y="135" class="metric-label">Base Parameters Frozen</text>
  <text x="50" y="168" class="metric-val">124,439,808</text>
  <text x="50" y="190" class="metric-delta">🛡️ 100% of Base Weights Intact</text>

  <!-- Metric Card 2 -->
  <rect x="295" y="110" width="245" height="95" class="card" />
  <text x="315" y="135" class="metric-label">Trainable LoRA Weights</text>
  <text x="315" y="168" class="metric-val">294,912</text>
  <text x="315" y="190" class="metric-delta">⚡ 0.236% (~420x Reduction)</text>

  <!-- Metric Card 3 -->
  <rect x="560" y="110" width="245" height="95" class="card" />
  <text x="580" y="135" class="metric-label">Adapter Checkpoint Size</text>
  <text x="580" y="168" class="metric-val">1.13 MB</text>
  <text x="580" y="190" class="metric-delta">💾 ~440x Smaller Than Full Model</text>

  <!-- Metric Card 4 -->
  <rect x="825" y="110" width="245" height="95" class="card" />
  <text x="845" y="135" class="metric-label">Policy Grounding Recall</text>
  <text x="845" y="168" class="metric-val">89.2%</text>
  <text x="845" y="190" class="metric-delta">📈 +76.7% vs Zero-Shot Base</text>

  <!-- Left Main Panel: Training Loss Convergence -->
  <rect x="30" y="220" width="510" height="395" class="card" />
  <text x="55" y="250" class="section-title">📉 Training Loss Convergence Curve (Cross-Entropy)</text>
  
  <!-- Chart axes and grid -->
  <line x1="80" y1="280" x2="490" y2="280" class="chart-grid" />
  <text x="60" y="284" class="text-dim">3.5</text>
  <line x1="80" y1="340" x2="490" y2="340" class="chart-grid" />
  <text x="60" y="344" class="text-dim">2.5</text>
  <line x1="80" y1="400" x2="490" y2="400" class="chart-grid" />
  <text x="60" y="404" class="text-dim">1.5</text>
  <line x1="80" y1="460" x2="490" y2="460" class="chart-grid" />
  <text x="60" y="464" class="text-dim">0.5</text>
  <line x1="80" y1="490" x2="490" y2="490" stroke="#475569" stroke-width="1.5" />

  <!-- X axis labels -->
  <text x="80" y="515" class="text-dim">Epoch 1</text>
  <text x="180" y="515" class="text-dim">Epoch 2</text>
  <text x="280" y="515" class="text-dim">Epoch 3</text>
  <text x="380" y="515" class="text-dim">Epoch 4</text>
  <text x="470" y="515" class="text-dim">Epoch 5</text>

  <!-- Loss Curve (Scaled) -->
  <path d="M 80,300 C 130,360 180,400 280,440 S 380,465 480,475" class="chart-line" />
  <circle cx="80" cy="300" r="5" class="chart-point" />
  <circle cx="180" cy="390" r="5" class="chart-point" />
  <circle cx="280" cy="440" r="5" class="chart-point" />
  <circle cx="380" cy="465" r="5" class="chart-point" />
  <circle cx="480" cy="475" r="5" class="chart-point" />

  <text x="55" y="560" class="text-main"><tspan class="text-bold">Training Duration:</tspan> 9.51 seconds across 5 epochs</text>
  <text x="55" y="585" class="text-main"><tspan class="text-bold">Final Loss:</tspan> 0.6890 | <tspan class="text-bold">Optimizer:</tspan> AdamW (lr=2e-4, weight_decay=0.01)</text>

  <!-- Right Main Panel: Side-by-Side Evaluation -->
  <rect x="560" y="220" width="510" height="395" class="card" />
  <text x="585" y="250" class="section-title">🧪 Side-by-Side Model Grounding Comparison</text>
  
  <text x="585" y="280" class="text-dim">Test Ingestion Query:</text>
  <text x="585" y="302" class="text-main text-bold">"How do I apply for a certified copy of a birth certificate?"</text>

  <!-- Base Model Card -->
  <rect x="585" y="325" width="460" height="110" rx="6" fill="#18181b" stroke="#7f1d1d" stroke-width="1.5" />
  <rect x="595" y="335" width="85" height="20" class="tag-base" />
  <text x="637" y="349" class="tag-text">Base GPT-2</text>
  <text x="965" y="350" font-family="-apple-system, sans-serif" font-size="12px" fill="#ef4444" font-weight="600">Grounding: 12.5%</text>
  <text x="595" y="380" class="text-main">"You can get a certificate from any local hospital or</text>
  <text x="595" y="400" class="text-main">doctor upon written request with personal details."</text>
  <text x="595" y="422" font-family="-apple-system, sans-serif" font-size="11px" fill="#f87171">⚠️ Hallucination: False procedure, missing official form &amp; fee.</text>

  <!-- LoRA Adapted Card -->
  <rect x="585" y="450" width="460" height="115" rx="6" fill="#18181b" stroke="#065f46" stroke-width="1.5" />
  <rect x="595" y="460" width="115" height="20" class="tag-lora" />
  <text x="652" y="474" class="tag-text">LoRA Adapted (r=8)</text>
  <text x="965" y="475" font-family="-apple-system, sans-serif" font-size="12px" fill="#10b981" font-weight="600">Grounding: 93.8%</text>
  <text x="595" y="505" class="text-main">"Submit Form BC-1 online via citizen portal or visit the</text>
  <text x="595" y="525" class="text-main">Vital Statistics office with photo ID and statutory fee of $15."</text>
  <text x="595" y="548" font-family="-apple-system, sans-serif" font-size="11px" fill="#34d399">✅ Grounded: Matches departmental code Form BC-1 &amp; $15 fee.</text>

  <!-- Weight Merging Status Tag -->
  <rect x="585" y="575" width="460" height="30" rx="4" fill="#0f172a" stroke="#334155" />
  <text x="600" y="595" font-family="-apple-system, sans-serif" font-size="12px" fill="#38bdf8" font-weight="600">🚀 Production Serving: Zero-Latency Merged Weight (W_merged = W_0 + α/r·B·A)</text>
</svg>